server:
  # TopicMan has no login, so by default only this machine can reach it. To expose it, set
  # SERVER_ADDRESS (README.md, "Expose TopicMan").
  address: 127.0.0.1

spring:
  application:
    name: TopicMan
  datasource:
    # With nothing configured, an embedded database on disk, for testing and home use (ADR 0010). To
    # use PostgreSQL, set SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD. PostgreSQL mode is for the
    # repositories' nextval('...').
    url: jdbc:h2:file:${topicman.data-dir}/topicman;MODE=PostgreSQL
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # FrontendConfiguration serves the static resources instead, with the client-route fallback.
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

topicman:
  # Where the embedded database and its generated master key live.
  data-dir: ${TOPICMAN_DATA_DIR:${user.home}/.topicman}
  # Load example connections, collections and environments into a new database. Unset means yes on
  # the embedded database and no on PostgreSQL.
  seed-examples: ${TOPICMAN_SEED_EXAMPLES:}
  crypto:
    # Base64-encoded 256-bit key, e.g. `openssl rand -base64 32` (ADR 0005). Required with PostgreSQL;
    # with the embedded database, a missing key is generated in generated-key-file (ADR 0010).
    master-key: ${TOPICMAN_MASTER_KEY:}
    generated-key-file: ${topicman.data-dir}/master.key

springdoc:
  # The specs are hand-written (ADR 0004). springdoc only runs Swagger UI when its code-first
  # api-docs are on, so they stay on but document no controller path.
  paths-to-match: /none
  swagger-ui:
    disable-swagger-default-url: true
    # One entry per context spec in src/main/resources/openapi/; OpenApiSpecsIT checks the list.
    urls:
      - name: Connections
        url: /openapi/connection.yaml
      - name: Messaging
        url: /openapi/messaging.yaml
      - name: Collections
        url: /openapi/collection.yaml

logging:
  level:
    # Kafka clients log every config and connection attempt at INFO
    org.apache.kafka: warn
    # Pulsar clients log every connection and producer or reader lifecycle step at INFO
    org.apache.pulsar: warn
    # Logs every lookup of a missing topic with a stack trace, including each connection test's
    # deliberate one; the adapter reports lookup failures itself.
    org.apache.pulsar.client.impl.BinaryProtoLookupService: error
