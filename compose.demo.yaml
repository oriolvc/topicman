# PostgreSQL and one broker of each kind, to try TopicMan end to end on this machine.
#
#   source ~/.config/topicman/env   # TOPICMAN_MASTER_KEY, see README.md
#   SPRING_PROFILES_ACTIVE=demo ./gradlew bootRun
#
# Spring Boot starts these containers, waits until they are healthy and removes them when the app
# stops (application-demo.yaml), so every run starts empty. If the app was killed instead of
# stopped, remove them by hand: `docker compose -f compose.demo.yaml down`.
#
# Connections to create in the UI:
#
#   Kafka     localhost:9092                 topics are created on first produce
#   Pulsar    pulsar://localhost:6650        topics are created on first produce
#   RabbitMQ  amqp://localhost:5672          no credentials (the broker's default guest user);
#                                            use the amq.topic or amq.fanout exchange, or create one
#
# Broker UIs: Pulsar admin API http://localhost:8082, RabbitMQ management http://localhost:15672.
# The ports are fixed (PostgreSQL on 5431), so stop compose.kafka.yaml first if it is running.
#
# To run the app from the IDE instead, start the containers on their own and use the `local` profile:
#   docker compose -f compose.demo.yaml up -d --wait
#   SPRING_PROFILES_ACTIVE=local ./gradlew bootRun

# A project of its own: compose.yaml's PostgreSQL is in project `topicman` too, so removing the
# demo's containers would otherwise remove the development database as well.
name: topicman-demo

services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=topicman'
      - 'POSTGRES_USER=topicman'
      - 'POSTGRES_PASSWORD=topicman'
    ports:
      # Fixed, so the `local` profile can use this database too (application-local.yaml).
      - '5431:5432'

  kafka:
    image: 'apache/kafka:4.3.1'
    ports:
      - '9092:9092'
    environment:
      # Setting any KAFKA_ variable replaces the image's defaults, so the whole config is here.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Clients run on the host, so the broker advertises the published port there.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - 'CMD-SHELL'
        - '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null'
      interval: 5s
      timeout: 10s
      retries: 20

  pulsar:
    image: 'apachepulsar/pulsar:4.2.4'
    command: ['bin/pulsar', 'standalone']
    ports:
      - '6650:6650'
      # TopicMan serves on 8080, so Pulsar's HTTP port moves to 8082.
      - '8082:8080'
    environment:
      PULSAR_MEM: '-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m'
    healthcheck:
      test: ['CMD-SHELL', 'bin/pulsar-admin brokers healthcheck']
      interval: 5s
      timeout: 15s
      retries: 30

  rabbitmq:
    image: 'rabbitmq:4.2-management'
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 20
